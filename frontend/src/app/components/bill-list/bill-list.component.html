<div class="container-fluid pt-3 pb-5 mb-5">
  <div class="d-flex align-items-center mb-3">
    <button mat-icon-button routerLink="/dashboard">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h3 class="m-0 ms-2 font-weight-bold">Bill History</h3>
  </div>

  <div class="mb-3 px-1">
    <mat-form-field appearance="outline" class="w-100 mb-0 dense-form-field">
      <mat-label>Search by Bill No. or Customer Name</mat-label>
      <input matInput type="text" [(ngModel)]="searchQuery" (ngModelChange)="filterBills()">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div *ngIf="filteredBills.length === 0" class="text-center mt-5 text-muted">
    <mat-icon style="font-size: 64px; width: 64px; height: 64px; opacity: 0.5;">receipt_long</mat-icon>
    <p class="mt-3">No bills generated yet.</p>
  </div>

  <div *ngFor="let bill of filteredBills" class="mb-3">
    <mat-card class="bill-card">
      <mat-card-content>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-bold text-primary">{{bill.billNumber}}</span>
          <span class="text-muted small">{{bill.date | date:'dd-MMM-yyyy'}}</span>
        </div>
        <div class="d-flex justify-content-between">
          <div>
            <div class="fw-bold">{{bill.customerName || 'Walk-in Customer'}}</div>
            <div class="small text-muted">{{bill.mobileNumber}}</div>
          </div>
          <div class="text-end">
            <div class="small text-muted">Total</div>
            <div class="fw-bold fs-5 text-success">₹{{bill.grandTotal}}</div>
          </div>
        </div>
        <hr class="my-2">
        <div class="d-flex justify-content-between flex-wrap gap-2">
          <button mat-flat-button color="accent" (click)="viewBill(bill)">
            <mat-icon>receipt</mat-icon> View
          </button>
          <button mat-stroked-button color="primary" (click)="downloadPdf(bill.id)">
            <mat-icon>download</mat-icon> PDF
          </button>
          <button mat-stroked-button class="text-success border-success" (click)="shareWhatsApp(bill)" *ngIf="bill.mobileNumber">
            <mat-icon>chat</mat-icon> WhatsApp
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
